name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      # Runs the deterministic guardrails against the golden set. No API key and
      # no cost, so it can gate every PR. It asserts the rules never lock a reply
      # to the wrong intent — a false lock cannot be recovered downstream,
      # because the model is not permitted to unlock a rule verdict.
      - name: Eval gate (rules only)
        run: npm run eval:rules

      - name: Build
        run: npm run build

  # The full eval calls the real model, so it needs a key and costs money.
  # It runs on demand rather than on every push. Same gates, same script.
  full-eval:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Full eval against the golden set
        run: npm run eval
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
